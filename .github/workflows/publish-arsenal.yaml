name: Publish Arsenal Image

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile.arsenal
          push: true
          tags: |
            ghcr.io/roundtable-k8s/arsenal:sha-${{ github.sha }}
            ghcr.io/roundtable-k8s/arsenal:main

      - name: Write digest to job summary
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          echo "Pinned reference: \`ghcr.io/roundtable-k8s/arsenal@${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "ghcr.io/roundtable-k8s/arsenal@${DIGEST}"
