name: Validate Skills

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]

# Only pull_request runs are cancelled by a newer push; push to main and merge queue runs always finish.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate SKILL.md frontmatter
        run: |
          #!/usr/bin/env python3
          import yaml
          import glob
          import sys
          import re

          errors = []
          # Search all tier directories
          skill_files = []
          for tier in ["shared", "project", "watch", "coding"]:
              skill_files.extend(glob.glob(f"{tier}/**/SKILL.md", recursive=True))

          if not skill_files:
              print("ERROR: No SKILL.md files found!")
              sys.exit(1)

          print(f"Found {len(skill_files)} SKILL.md files")

          NAME_RE = re.compile(r'^[a-z][a-z0-9]*(-[a-z0-9]+)*$')

          for path in sorted(skill_files):
              with open(path) as f:
                  content = f.read()

              # Check for YAML frontmatter
              if not content.startswith("---"):
                  errors.append(f"{path}: Missing YAML frontmatter (must start with ---)")
                  continue

              parts = content.split("---", 2)
              if len(parts) < 3:
                  errors.append(f"{path}: Invalid frontmatter format")
                  continue

              try:
                  meta = yaml.safe_load(parts[1])
              except yaml.YAMLError as e:
                  errors.append(f"{path}: Invalid YAML: {e}")
                  continue

              if not isinstance(meta, dict):
                  errors.append(f"{path}: Frontmatter is not a mapping")
                  continue

              name = meta.get("name")
              desc = meta.get("description")

              if not name:
                  errors.append(f"{path}: Missing required field 'name'")
              elif not NAME_RE.match(name):
                  errors.append(f"{path}: Invalid name '{name}' — must be lowercase alphanumeric + hyphens")
              elif len(name) > 64:
                  errors.append(f"{path}: Name too long ({len(name)} > 64 chars)")

              if not desc:
                  errors.append(f"{path}: Missing required field 'description'")
              elif len(desc) > 1024:
                  errors.append(f"{path}: Description too long ({len(desc)} > 1024 chars)")

              # Verify name matches parent directory
              import os
              parent_dir = os.path.basename(os.path.dirname(path))
              if name and name != parent_dir:
                  errors.append(f"{path}: name '{name}' doesn't match directory '{parent_dir}'")

              print(f"  ✓ {path} — {name}")

          if errors:
              print(f"\n{len(errors)} error(s) found:")
              for e in errors:
                  print(f"  ✗ {e}")
              sys.exit(1)

          print("\nAll SKILL.md files valid! ✓")
        shell: python

      - name: Check script permissions
        run: |
          echo "Checking script files..."
          errors=0
          while IFS= read -r script; do
            # Shell/Python files by extension, and every extension-less file in a scripts/ dir with a shebang.
            case "$script" in
              *.sh|*.py) ;;
              *) [[ "$(head -c2 "$script")" == "#!" ]] || continue ;;
            esac
            if [[ ! -x "$script" ]]; then
              echo "  ✗ Not executable: $script"
              errors=$((errors + 1))
            else
              echo "  ✓ $script"
            fi
          done < <(find shared project watch coding \( -name "*.sh" -o -name "*.py" -o -path "*/scripts/*" \) -type f 2>/dev/null | sort)

          if [[ $errors -gt 0 ]]; then
            echo ""
            echo "$errors script(s) are not executable."
            echo "Fix with: chmod +x <script>"
            exit 1
          fi
          echo ""
          echo "All scripts are executable! ✓"

      - name: Check test tools
        run: |
          # The vault-indexer test skips itself without these, so fail here instead of passing silently.
          for tool in jq sqlite3 yq python3 curl; do
            command -v "$tool" >/dev/null || { echo "::error::$tool is not on the runner"; exit 1; }
            echo "  ✓ $tool"
          done
          # shared/vault-indexer needs the mikefarah (Go) yq, not the python-yq wrapper.
          yq_version=$(yq --version 2>&1 || true)
          echo "  yq: $yq_version"
          if [[ "$yq_version" != *mikefarah* ]]; then
            echo "::error::yq is not mikefarah/yq (got: $yq_version)"
            exit 1
          fi

      - name: Run script tests
        run: |
          fail=0
          for t in project/*/tests/*.sh shared/*/tests/*.sh tests/*.sh; do
            [ -e "$t" ] || continue
            echo "::group::$t"
            if bash "$t"; then
              echo "  ✓ $t"
            else
              echo "  ✗ FAILED: $t"
              fail=1
            fi
            echo "::endgroup::"
          done
          if [[ $fail -ne 0 ]]; then
            echo "One or more script tests failed."
            exit 1
          fi
          echo "All script tests passed! ✓"

      - name: Install pinned shellcheck
        env:
          SHELLCHECK_VERSION: v0.10.0
          SHELLCHECK_SHA256: 6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87
        run: |
          curl -sSfL -o "$RUNNER_TEMP/shellcheck.tar.xz" \
            "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/shellcheck.tar.xz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/shellcheck-bin"
          tar -xJf "$RUNNER_TEMP/shellcheck.tar.xz" -C "$RUNNER_TEMP/shellcheck-bin" --strip-components=1 "shellcheck-${SHELLCHECK_VERSION}/shellcheck"
          echo "$RUNNER_TEMP/shellcheck-bin" >> "$GITHUB_PATH"

      - name: shellcheck
        run: |
          shellcheck --version
          fail=0
          while IFS= read -r script; do
            first=$(head -n1 "$script")
            # Only bash/sh scripts (not Python, not JSON, not zsh/ksh).
            [[ "$first" =~ ^#!(/usr/bin/env +|/[a-z/]*/)(ba)?sh([[:space:]]|$) ]] || continue
            if shellcheck -S warning "$script"; then
              echo "  ✓ $script"
            else
              echo "  ✗ shellcheck: $script"
              fail=1
            fi
          done < <(find shared project watch coding -path "*/scripts/*" -type f | sort)
          exit $fail

      - name: Validate skill directory structure
        run: |
          echo "Checking agentskills.io compliance..."
          errors=0
          for skill_md in $(find shared project watch coding -name "SKILL.md" 2>/dev/null | sort); do
            skill_dir=$(dirname "$skill_md")
            # Check for unexpected files at skill root (only SKILL.md + known dirs)
            for item in "$skill_dir"/*; do
              base=$(basename "$item")
              case "$base" in
                SKILL.md|scripts|references|assets|LICENSE*) ;;
                *) echo "  ⚠ Unexpected: $item"; ;;
              esac
            done
            echo "  ✓ $skill_dir"
          done
          echo "Structure check complete! ✓"
